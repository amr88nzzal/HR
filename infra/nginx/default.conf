# عنوان العميل الحقيقي: ترويسة Cloudflare إن وُجدت وإلا عنوان الاتصال المباشر (يُستخدم في تحديد المعدل)
map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  ''      $remote_addr;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 100m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # الاستيراد المتزامن قد يستغرق دقيقة لـ 5000 صف (Cloudflare يقطع عند 100 ثانية)
  location /api/v1/employee-import {
    proxy_pass http://api:3000;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /health/ {
    proxy_pass http://api:3000;
  }

  # ملفات ببصمة المحتوى: تخزين طويل. index.html بلا تخزين مؤقت.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
