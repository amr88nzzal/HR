# التشغيل: cp .env.example .env ثم عدّل كلمة المرور، ثم:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
name: hrms
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    # لا منافذ منشورة: القاعدة داخل الشبكة الخاصة فقط

  # خطوة تهجير القاعدة (تعمل مرة عند كل نشر ثم تنتهي)؛ الـ API ينتظر نجاحها
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    # يرحّل بحساب المالك ثم يضبط دور التطبيق hrms_app ويزامن كتالوج الصلاحيات
    command:
      - sh
      - -c
      - >-
        node_modules/.bin/node-pg-migrate -m migrations --migration-file-language sql -d DATABASE_URL up
        && node dist/cli.js post-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
      # مفاتيح التشفير: يحتاجها أمر seed-demo لإضافة الحسابات البنكية والحقول الحساسة
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:-}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-}
      ENCRYPTION_DIGEST_KEY: ${ENCRYPTION_DIGEST_KEY:-}
      # مخزن الملفات نفسه للـ API: يحتاجه seed-demo لحفظ شعار وختم الشركة التجريبيين
      STORAGE_DIR: /data/files
    volumes:
      - filesdata:/data/files
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [internal]

  # تحويل HTML إلى PDF للوثائق الصادرة (Chromium + الخطوط العربية)؛ داخلية فقط بلا منفذ منشور
  render:
    build:
      context: ..
      dockerfile: services/render/Dockerfile
    restart: unless-stopped
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # التطبيق يتصل بدور hrms_app (ليس المالك) فتسري عليه سياسات RLS
      DATABASE_URL: postgresql://hrms_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      # تشفير الحقول الحساسة (IBAN وغيره): انظر README لتوليد المفاتيح واحفظها خارج الخادم أيضاً
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set in .env}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:?set in .env}
      ENCRYPTION_DIGEST_KEY: ${ENCRYPTION_DIGEST_KEY:?set in .env}
      STORAGE_DIR: /data/files
      RENDER_URL: http://render:3100
      # العنوان العام للنظام: يُبنى منه رابط التحقق في رمز QR (بدونه تصدر الوثائق بلا QR)
      PUBLIC_URL: ${PUBLIC_URL:-}
      # بلاغات الأخطاء إلى GlitchTip (اختياري)؛ لا يُرسل جسم الطلب ولا بيانات شخصية
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_RELEASE: ${APP_RELEASE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DEFAULT_COMPANY_SLUG: ${DEFAULT_COMPANY_SLUG:-main}
      PLATFORM_ADMIN_KEY: ${PLATFORM_ADMIN_KEY:-}
      # بريد احتياطي إن لم يُضبط من شاشة قنوات الإشعار (يُستعمل أيضاً لاختبار الإرسال)
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-HRMS <no-reply@localhost>}
    volumes:
      - filesdata:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3000/health/live || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

  # عملية العمّال: تنفّذ طوابير pg-boss وتجدول المهام الدورية (لا منافذ)
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: ['node', 'dist/worker.js']
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # المهام تعمل عبر hrms_app (RLS)، وصيانة مخطط الطابور بحساب المالك
      DATABASE_URL: postgresql://hrms_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STORAGE_DIR: /data/files
      # رابط الموقع في إشعارات التقارير الكبيرة
      PUBLIC_URL: ${PUBLIC_URL:-}
      # بلاغات الأخطاء إلى GlitchTip (اختياري)؛ لا يُرسل جسم الطلب ولا بيانات شخصية
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_RELEASE: ${APP_RELEASE:-}
      # SMTP عام لإرسال البريد (اختياري): smtp://user:pass@host:587 ؛ بدونه تُعلَّم الرسائل skipped
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-HRMS <no-reply@localhost>}
      # يفك تشفير كلمات سر القنوات المحفوظة من الشاشة (SMTP وتلغرام)
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set in .env}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:?set in .env}
      ENCRYPTION_DIGEST_KEY: ${ENCRYPTION_DIGEST_KEY:?set in .env}
    volumes:
      - filesdata:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  # نسخ احتياطي مشفّر يومي + تحقق استعادة أسبوعي (يُفعَّل بـ: --profile backup). انظر docs/RUNBOOK.md
  backup:
    profiles: [backup]
    build:
      context: ..
      dockerfile: infra/backup/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      FILES_DIR: /data/files
      BACKUP_PASSPHRASE_FILE: /run/backup_passphrase
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-02}
      KEEP_DAILY: ${KEEP_DAILY:-7}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-4}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-6}
      # وجهة خارج السيرفر (rclone)، مثل b2:hrms-backups؛ إعداد rclone في المجلد المركّب أدناه
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - backups:/backups
      # ملف العبارة (مسار مطلق في .env: BACKUP_PASSPHRASE_FILE)
      - ${BACKUP_PASSPHRASE_FILE:-/etc/hrms/backup.passphrase}:/run/backup_passphrase:ro
      - filesdata:/data/files:ro
      - ${RCLONE_CONFIG_DIR:-/etc/hrms/rclone}:/config/rclone:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.gateway
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8080}:80' # يستقبل نفق Cloudflare محلياً
    depends_on: [api]
    networks: [internal]

volumes:
  pgdata:
  filesdata:
  backups:
networks:
  internal:
