name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  # مرآة AWS العامة للصور الأساسية في بناء Docker: تتجنب حدّ السحب (429) لمشغّلات GitHub على Docker Hub
  MIRROR: public.ecr.aws/docker/library
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
  integration:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # PostgreSQL 18 يُثبَّت مباشرة من مستودع PGDG: لا سحب صور من Docker Hub (حدّ 429 على مشغّلات GitHub)
      - name: Install PostgreSQL 18
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-18
          sudo pg_ctlcluster 18 main start || true
          sudo pg_lsclusters
          PORT=$(sudo pg_lsclusters -h | awk '$1=="18" {print $3}')
          echo "PG_PORT=$PORT" >> "$GITHUB_ENV"
          sudo -u postgres psql -p "$PORT" -c "alter user postgres password 'postgres'"
      - run: pnpm --filter @hrms/api test:integration
        env:
          TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:${{ env.PG_PORT }}/postgres
          TEST_REQUIRE_PG18: 'true'
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile.api --build-arg NODE_IMAGE=${{ env.MIRROR }}/node:22-alpine -t hrms-api .
      # التأكد أن الوحدة الأصلية (argon2) تعمل في صورة alpine الإنتاجية
      - run: docker run --rm hrms-api node -e "import('@node-rs/argon2').then(m => m.hash('x')).then(() => console.log('argon2 ok'))"
      - run: docker build -f infra/Dockerfile.gateway --build-arg NODE_IMAGE=${{ env.MIRROR }}/node:22-alpine --build-arg NGINX_IMAGE=${{ env.MIRROR }}/nginx:alpine -t hrms-gateway .
